<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TRON Permission Control</title><style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial;margin:0;background:#f4f6f8;color:#18212b}.wrap{max-width:1000px;margin:32px auto;padding:0 20px}.card{background:#fff;border-radius:16px;padding:24px;box-shadow:0 6px 24px #0000000d;margin-bottom:20px}h1{margin:0 0 6px;font-size:26px}.muted{color:#6b7280;font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field{display:flex;flex-direction:column;gap:7px}.field.full{grid-column:1/-1}label{font-weight:600;font-size:14px}input{padding:12px;border:1px solid #d5dbe3;border-radius:10px;font:inherit}button{border:0;border-radius:10px;padding:12px 16px;font-weight:700;cursor:pointer;background:#111827;color:white;margin-right:8px}.secondary{background:#e9edf2;color:#111827}.danger{background:#b42318}.status{padding:12px;border-radius:10px;background:#f0f4f8;margin-top:14px;white-space:pre-wrap}.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;word-break:break-all}.badge{padding:4px 8px;border-radius:99px;background:#e7f6ec;color:#137333;font-size:12px}.warn{background:#fff4e5;color:#9a6700}.request{border:1px solid #e0e5eb;border-radius:12px;padding:14px;margin-top:10px}.links{display:none;margin-top:12px;padding:12px;background:#f7f8fa;border-radius:10px}.small{font-size:12px}
</style></head><body><div class="wrap"><div class="card"><h1>TRON Permission Control</h1><div class="muted">桌面端权限申请控制台 · C 不需要访问本程序网页；钱包签名仍必须由 C 的钱包完成。</div><div class="status warn">重要：本程序不能绕过钱包厂商安全机制。TronLink / TokenPocket 的 DeepLink 可以唤起手机钱包，但电脑不能凭 C 地址直接把手机钱包强制弹窗。imToken 当前以 WalletConnect/DApp 连接为主。</div></div>
<div class="card"><h2>创建 C → A+B 权限变更申请</h2><div class="grid"><div class="field full"><label>C：目标账户</label><input id="target" placeholder="T..." /></div><div class="field"><label>A：控制地址</label><input id="a" placeholder="T..." /></div><div class="field"><label>B：控制地址</label><input id="b" placeholder="T..." /></div></div><div style="margin-top:18px"><button id="create">创建申请</button><button class="secondary" id="refresh">刷新</button></div><div id="msg" class="status" style="display:none"></div></div>
<div class="card"><h2>请求</h2><div id="list" class="muted">加载中…</div></div>
<div class="card"><h2>钱包唤起</h2><div class="muted">选择请求后生成官方 DeepLink。实际手机钱包是否弹出，由钱包 App 版本及其安全策略决定。</div><div id="selected" class="status">尚未选择请求</div><div class="row" style="margin-top:12px"><button id="tl" disabled>打开 TronLink</button><button id="tp" disabled>打开 TokenPocket</button><button class="secondary" id="showLinks" disabled>显示链接</button></div><div id="links" class="links"></div></div>
</div><script src="renderer.js"></script></body></html>
